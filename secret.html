<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Survival Game</title>
		<style>
			body {
			background: #121212;
			color: #f1f1f1;
			font-family: 'Arial', sans-serif;
			padding: 20px;
			text-align: center;
			}
			
			#game {
			max-width: 960px;
			margin: auto;
			}
			
			h1 {
			font-size: 36px;
			color: #f0e68c;
			margin-bottom: 20px;
			}
			
			h2 {
			font-size: 28px;
			margin: 20px 0;
			color: #e6e6e6;
			}
			
			.status {
			display: flex;
			justify-content: space-around;
			margin-bottom: 20px;
			font-size: 18px;
			}
			
			.status div {
			background: #333;
			padding: 15px;
			border-radius: 10px;
			width: 25%;
			box-sizing: border-box;
			}
			
			.map {
			display: grid;
			grid-template-columns: repeat(7, 70px);
			gap: 10px;
			justify-content: center;
			margin-bottom: 30px;
			}
			
			.tile {
			background: #444;
			padding: 25px;
			cursor: pointer;
			border-radius: 10px;
			font-size: 14px;
			transition: background 0.3s ease;
			color: #f0f0f0;
			}
			
			.tile.active {
			background: #4CAF50;
			}
			
			.tile:hover {
			background: #555;
			}
			
			button {
			margin: 10px;
			padding: 12px 25px;
			font-size: 16px;
			background-color: #28a745;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background-color 0.3s ease;
			}
			
			button:hover {
			background-color: #218838;
			}
			
			#log {
			margin-top: 20px;
			background: #222;
			padding: 15px;
			border-radius: 8px;
			min-height: 50px;
			font-size: 14px;
			width: 100%;
			box-sizing: border-box;
			color: #ffcc00;
			}
			
			#gather-buttons,
			#inventory,
			#crafting {
			margin-top: 20px;
			}
			
			ul {
			list-style: none;
			padding: 0;
			}
			
			.button-container {
			display: flex;
			justify-content: center;
			flex-wrap: wrap;
			}
			
			.button-container button {
			margin: 10px;
			}
		</style>
	</head>
	<body>
		<!-- Home Button at the top-left corner -->
		<button id="home-button" onclick="window.location.href='index.html'">Home</button>
		
		<div id="game">
			<h1>🌿 Survival Crafting Game</h1>
			
			<div class="status">
				<div>❤️ Health: <span id="health">100</span></div>
				<div>🍗 Hunger: <span id="hunger">100</span></div>
				<div>🕒 Time: <span id="time">Day 1 - 6:00</span></div>
			</div>
			
			<h2>Explore the Map</h2>
			<div class="map" id="map"></div>
			
			<!-- Notification log moved below map -->
			<div id="log"></div>
			
			<!-- Eat Food button below the log -->
			<button onclick="eatFood()">🍽️ Eat Food</button>
			
			<h2>Gather Resources</h2>
			<div id="gather-buttons" class="button-container">
				<button onclick="gather('wood')">Gather Wood</button>
				<button onclick="gather('stone')">Gather Stone</button>
				<button onclick="gather('iron')">Mine Iron</button>
				<button onclick="gather('fiber')">Pick Fiber</button>
				<button onclick="gather('berries')">Pick Berries</button>
				<button onclick="gather('food')">Search for Meat</button>
			</div>
			
			<div id="inventory">
				<h2>Inventory</h2>
				<ul id="inventory-list"></ul>
			</div>
			
			<div id="crafting">
				<h2>Crafting</h2>
				<div class="button-container">
					<button onclick="craft('campfire')">Craft Campfire (2 Wood, 1 Stone)</button>
					<button onclick="craft('spear')">Craft Spear (3 Wood, 1 Stone)</button>
					<button onclick="craft('armor_light')">Craft Light Armor (3 Hide)</button>
					<button onclick="craft('armor_heavy')">Craft Heavy Armor (5 Hide, 2 Stone)</button>
					<button onclick="craft('iron_sword')">Craft Iron Sword (3 Iron, 2 Wood)</button>
					<button onclick="craft('bow')">Craft Bow (2 Wood, 3 Fiber)</button>
					<button onclick="craft('backpack')">Craft Backpack (5 Fiber, 2 Hide)</button>
				</div>
			</div>
		</div>
		
		<script>
			const player = {
				health: 100,
				hunger: 100,
				inventory: {
					wood: 0, stone: 0, iron: 0, fiber: 0, berries: 0, food: 0, hide: 0,
					campfire: 0, spear: 0, armor_light: 0, armor_heavy: 0, iron_sword: 0,
					bow: 0, backpack: 0
				},
				time: { hour: 6, day: 1 },
				location: 24
			};
			
			const mapSize = 49;  // Increased map size (7x7 grid)
			
			const enemies = [
			{ name: "Wolf", hp: 20, dmg: 5, loot: { hide: 1 } },
			{ name: "Bandit", hp: 30, dmg: 10, loot: { stone: 1, hide: 2 } },
			{ name: "Bear", hp: 50, dmg: 15, loot: { hide: 3, food: 1 } }
			];
			
			function updateStatus() {
				document.getElementById("health").textContent = player.health;
				document.getElementById("hunger").textContent = player.hunger;
				document.getElementById("time").textContent = `Day ${player.time.day} - ${player.time.hour}:00`;
				updateInventory();
			}
			
			function updateInventory() {
				const invList = document.getElementById("inventory-list");
				invList.innerHTML = '';
				for (let item in player.inventory) {
					const li = document.createElement("li");
					li.textContent = `${item}: ${player.inventory[item]}`;
					invList.appendChild(li);
				}
			}
			
			function gather(resource) {
				player.inventory[resource]++;
				advanceTime();
				updateStatus();
				log(`You gathered ${resource}.`);
			}
			
			function eatFood() {
				if (player.inventory.food > 0 || player.inventory.berries > 0) {
					if (player.inventory.food > 0) {
						player.inventory.food--;
						player.hunger = Math.min(100, player.hunger + 25);
						player.health = Math.min(100, player.health + 10);
						log("You ate some meat. (+25 hunger, +10 health)");
						} else {
						player.inventory.berries--;
						player.hunger = Math.min(100, player.hunger + 10);
						player.health = Math.min(100, player.health + 2);
						log("You ate some berries. (+10 hunger, +2 health)");
					}
					updateStatus();
					} else {
					log("You have no food to eat!");
				}
			}
			
			function craft(item) {
				if (item === 'campfire' && player.inventory.wood >= 2 && player.inventory.stone >= 1) {
					player.inventory.wood -= 2;
					player.inventory.stone -= 1;
					player.inventory.campfire += 1;
					log("You crafted a Campfire!");
					} else if (item === 'spear' && player.inventory.wood >= 3 && player.inventory.stone >= 1) {
					player.inventory.wood -= 3;
					player.inventory.stone -= 1;
					player.inventory.spear += 1;
					log("You crafted a Spear!");
					} else if (item === 'armor_light' && player.inventory.hide >= 3) {
					player.inventory.hide -= 3;
					player.inventory.armor_light += 1;
					log("You crafted Light Armor!");
					} else if (item === 'armor_heavy' && player.inventory.hide >= 5 && player.inventory.stone >= 2) {
					player.inventory.hide -= 5;
					player.inventory.stone -= 2;
					player.inventory.armor_heavy += 1;
					log("You crafted Heavy Armor!");
					} else if (item === 'iron_sword' && player.inventory.iron >= 3 && player.inventory.wood >= 2) {
					player.inventory.iron -= 3;
					player.inventory.wood -= 2;
					player.inventory.iron_sword += 1;
					log("You crafted an Iron Sword!");
					} else if (item === 'bow' && player.inventory.wood >= 2 && player.inventory.fiber >= 3) {
					player.inventory.wood -= 2;
					player.inventory.fiber -= 3;
					player.inventory.bow += 1;
					log("You crafted a Bow!");
					} else if (item === 'backpack' && player.inventory.fiber >= 5 && player.inventory.hide >= 2) {
					player.inventory.fiber -= 5;
					player.inventory.hide -= 2;
					player.inventory.backpack += 1;
					log("You crafted a Backpack! (+inventory space)");
					} else {
					log("Not enough resources to craft.");
				}
				updateStatus();
			}
			
			function advanceTime() {
				player.time.hour += 1;
				player.hunger -= 5;
				
				if (player.hunger <= 0) {
					player.hunger = 0;
					player.health -= 10;
					log("You're starving!");
				}
				
				if (player.time.hour >= 24) {
					player.time.hour = 0;
					player.time.day += 1;
					player.hunger -= 10;
				}
				
				if (player.health <= 0) {
					alert("You died...");
					location.reload();
				}
				
				updateStatus();
			}
			
			function renderMap() {
				const mapDiv = document.getElementById("map");
				mapDiv.innerHTML = '';
				for (let i = 0; i < mapSize; i++) {
					const tile = document.createElement("div");
					tile.classList.add("tile");
					if (i === player.location) tile.classList.add("active");
					tile.addEventListener("click", () => {
						player.location = i;
						advanceTime();
						renderMap();
						if (Math.random() < 0.4) {
							startCombat();
							} else {
							log("You explore the area. It's quiet...");
						}
					});
					mapDiv.appendChild(tile);
				}
			}
			
			function startCombat() {
				const enemy = { ...enemies[Math.floor(Math.random() * enemies.length)] };
				log(`⚠️ A wild ${enemy.name} appears!`);
				
				setTimeout(() => {
					const hasSpear = player.inventory.spear > 0;
					const hasIronSword = player.inventory.iron_sword > 0;
					const hasBow = player.inventory.bow > 0;
					let damageToEnemy = 5;
					
					if (hasIronSword) damageToEnemy = 40;
					else if (hasBow) damageToEnemy = 30;
					else if (hasSpear) damageToEnemy = 25;
					
					enemy.hp -= damageToEnemy;
					
					let logText = hasIronSword ? `You strike the ${enemy.name} with your Iron Sword!`
					: hasBow ? `You shoot an arrow at the ${enemy.name} with your Bow!`
					: hasSpear ? `You strike the ${enemy.name} with your spear!`
					: `You punch the ${enemy.name}!`;
					
					if (enemy.hp <= 0) {
						logText += `\nYou defeated the ${enemy.name}!`;
						for (let loot in enemy.loot) {
							player.inventory[loot] = (player.inventory[loot] || 0) + enemy.loot[loot];
							logText += `\nYou found ${enemy.loot[loot]} ${loot}.`;
						}
						} else {
						let armor = 0;
						if (player.inventory.armor_heavy > 0) armor = 10;
						else if (player.inventory.armor_light > 0) armor = 5;
						
						const finalDmg = Math.max(0, enemy.dmg - armor);
						player.health -= finalDmg;
						logText += `\nThe ${enemy.name} hits you for ${finalDmg} damage!`;
					}
					
					if (player.health <= 0) {
						alert("You were killed in battle...");
						location.reload();
					}
					
					updateStatus();
					log(logText);
				}, 500);
			}
			
			function log(message) {
				document.getElementById("log").textContent = message;
			}
			
			renderMap();
			updateStatus();
		</script>
	</body>
</html>
